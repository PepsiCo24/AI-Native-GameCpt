name: CI

# The gates AGENTS.md §7 demands as evidence, and architecture.md §12.1 calls
# "a hard CI gate, not a convention": the Phaser-free core boundary, the rule
# property tests, and a real browser build. No secrets are used here — the
# workflow needs no credentials, so nothing credential-shaped may be added to it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (lockfile is the source of truth)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + property tests
        run: npx vitest run --reporter=verbose

      # Level data gate: a schema-invalid or invariant-breaking level file must
      # fail the build rather than reach the Solver.
      - name: Validate level dataset
        run: npm run levels

      - name: Build
        run: npm run build

  # Standing browser regression (QA-005): 75+ trusted-input Playwright cases
  # against the real renderer — refusal freezes, latch doors, win routes,
  # controls, mobile. Required AFTER verify; advisory status ended with
  # QA-005's merge (Orchestrator ruling). Discipline: single worker, chromium
  # only, report uploaded on failure; retries per the cloud policy below
  # (CI-only, FLAKY-named). Known-defect pins rode green via test.fail() until
  # R-004b cleared them; the un-pin contract is documented in tests/e2e/README.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (lockfile is the source of truth)
        run: npm ci

      - name: Install browser (chromium only — the whole pinned project set)
        run: npx playwright install --with-deps chromium

      # Cloud retry policy, ruled 2026-10-15 after a same-commit discriminating experiment
      # (13 failed vs 9 failed, differing sets): a CI-only single retry. Playwright marks a
      # case that passes on retry as FLAKY — a distinct, REPORTED state, never a silent pass.
      # Every FLAKY must be named in a follow-up ticket. LOCAL runs stay zero-retry (QA-005
      # discipline: flake surfaces stay visible where developers can see them immediately).
      - name: Browser regression
        run: npx playwright test --retries=1

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
