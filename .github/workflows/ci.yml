name: CI

# The gates AGENTS.md §7 demands as evidence, and architecture.md §12.1 calls
# "a hard CI gate, not a convention": the Phaser-free core boundary, the rule
# property tests, and a real browser build. No secrets are used here — the
# workflow needs no credentials, so nothing credential-shaped may be added to it.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (lockfile is the source of truth)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit + property tests
        run: npx vitest run --reporter=verbose

      # Level data gate: a schema-invalid or invariant-breaking level file must
      # fail the build rather than reach the Solver.
      - name: Validate level dataset
        run: npm run levels

      - name: Build
        run: npm run build

  # Standing browser regression (QA-005): 88 trusted-input Playwright cases
  # against the real renderer — refusal freezes, latch doors, win routes,
  # controls, mobile. Required AFTER verify; advisory status ended with
  # QA-005's merge (Orchestrator ruling). Discipline: single worker, chromium
  # only, report uploaded on failure; retries per the cloud policy below
  # (zero since 2026-10-16, INFRA-001 — see the policy block). Known-defect
  # pins rode green via test.fail() until R-004b cleared them; the un-pin
  # contract is documented in tests/e2e/README.
  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install (lockfile is the source of truth)
        run: npm ci

      - name: Install browser (chromium only — the whole pinned project set)
        run: npx playwright install --with-deps chromium

      # Cloud retry policy v2, ruled 2026-10-16 (INFRA-001): retries REMOVED.
      # The v1 rule (2026-10-15, after the same-commit discriminating experiment
      # 13 vs 9) kept --retries=1 "until 2-3 clean CI rounds land". They landed —
      # five consecutive green rounds on the survivor lineage (PR #1, fb751de,
      # PR #3, develop tip 4bbfdf2, main 3da1240), each 88/0 with ZERO retry
      # consumption (no attempt #2 / FLAKY line in any run log). The survivor
      # roster closed 7 → 4 → 3 → 2 → 1 → 0, every death by measurement; the
      # suite now fails loud and immediately where it once flaked. Cloud and
      # local are aligned at zero-retry: a transient here is a named red ticket,
      # never a silent FLAKY pass. This PR's own round is the gate: if the
      # zero-retry round is red, revert this one-line change (the assertion
      # stays — the environment owes the suite an explanation, not a pardon).
      - name: Browser regression
        run: npx playwright test

      # Failure-artifact fix (Orchestrator, 2026-10-16): every red round so far
      # shipped ZERO artefacts — `playwright-report/` never exists because the
      # config's reporter is `list` only, and the run log carries the evidence
      # annotation "No files were found with the provided path: playwright-report/"
      # (QA-005e run 38795670240; latch L15 timeout run 38845237536). The traces we
      # pay for (`trace: "retain-on-failure"` in playwright.config.ts) do get
      # written — into `test-results/`, which nothing uploaded. A red must be
      # diagnosable from its own artefacts: `test-results/` carries trace.zip +
      # error-context.md per failed test, and `playwright-report/` is kept in the
      # list for the day an HTML reporter is added.
      - name: Upload traces + report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          retention-days: 7
